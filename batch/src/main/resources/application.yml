spring:
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/example}
    username: ${DB_USERNAME:example}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  batch:
    jdbc:
      # Batch metadata tables are created by the batch app only (never by Flyway/core, never by api-*)
      initialize-schema: always

app:
  batch:
    chunk-size: 100
    retention-days: 90
