spring:
  main:
    # no HTTP server for now (the actuator HTTP port is added in a later task)
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/example}
    username: ${DB_USERNAME:example}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  grpc:
    server:
      port: 9190
      inbound:
        message:
          # 256KB: a post is at most 10000 chars (<= ~40KB in UTF-8), so this bounds memory per call
          max-size: 256KB
        metadata:
          max-size: 8KB
      reflection:
        # off by default; set SPRING_GRPC_SERVER_REFLECTION_ENABLED=true for local grpcurl without -proto
        enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: PT15M
    refresh-ttl: P7D
  aop:
    slow-threshold-ms: 500
