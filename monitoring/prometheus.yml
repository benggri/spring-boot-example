global:
  scrape_interval: 15s

scrape_configs:
  - job_name: example-apps
    metrics_path: /actuator/prometheus
    static_configs:
      # api-rest, api-graphql management ports and the api-grpc actuator port, on the Docker host
      - targets:
          - host.docker.internal:8081
          - host.docker.internal:8082
          - host.docker.internal:8083
